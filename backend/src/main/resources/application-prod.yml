spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    com.aegisx: INFO
    org.hibernate.SQL: WARN
