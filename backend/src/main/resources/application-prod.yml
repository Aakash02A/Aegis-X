# MySQL 8.4 production profile. Select with `SPRING_PROFILES_ACTIVE=prod`.
#
# ddl-auto is `validate`: the schema comes from Flyway, and ANY disagreement between the entity
# model and db/migration fails startup rather than being auto-corrected. flyway.validate-on-migrate
# stays ON, so checksum drift in an applied migration is loud.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.time_zone: UTC
        type.preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

aegisx:
  cors:
    # No development-origin fallback is allowed in prod. ProductionSafetyChecks rejects empty
    # configuration so deployments must name their frontend origins explicitly.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    com.aegisx: INFO
    org.hibernate.SQL: WARN
