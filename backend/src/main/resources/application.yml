spring:
  application:
    name: aegisx

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-for-aegis-x-application-security-testing-purposes-only}
  expiration: ${JWT_EXPIRATION:86400000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_mock_key}
  key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_mock_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dev-webhook-secret-for-aegis-x-local-testing}

server:
  port: ${PORT:8080}

app:
  storage:
    root-path: ${APP_STORAGE_ROOT_PATH:./storage}
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    max-file-size-mb: 20

aegisx:
  ocr:
    tesseract-path: ${TESSERACT_PATH:}
    language: ${OCR_LANGUAGE:eng}
  ai:
    prompt-version: v1
    model-name: ${AI_MODEL_NAME:gpt-4o}
    timeout-seconds: 30
    max-retries: 2
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    webhook-verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    api-endpoint: https://graph.instagram.com/v18.0
    sandbox-mode: ${WHATSAPP_SANDBOX_MODE:true}

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          temperature: 0.0
          max-tokens: 2048
          timeout-seconds: 30
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2KB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
