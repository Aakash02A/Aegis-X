spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aegisx_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  storage:
    root-path: ${APP_STORAGE_ROOT_PATH:./storage-test}
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    max-file-size-mb: 20

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2KB

logging:
  level:
    com.aegisx: DEBUG
    org.hibernate.SQL: DEBUG
