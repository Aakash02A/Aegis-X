spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2KB

app:
  storage:
    root-path: ${APP_STORAGE_ROOT_PATH:./storage-test}
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    max-file-size-mb: 20

settlement:
  mock-enabled: true

logging:
  level:
    com.aegisx: DEBUG
    org.hibernate.SQL: DEBUG
