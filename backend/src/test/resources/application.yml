spring:
  application:
    name: aegisx-test
  datasource:
    url: jdbc:h2:mem:aegisx_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  profiles:
    active: test
  ai:
    openai:
      api-key: test-key-not-used-for-network-calls
  # In tests, external notification delivery is not configured.
  # Empty values allow the integration client to initialize without credentials.
  # Actual provider credentials are supplied through the developer's environment.

jwt:
  secret: dev-jwt-secret-key-for-aegis-x-application-security-testing-purposes-only
  expiration: 86400000

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

aegisx:
  whatsapp:
    phone-number-id: test-phone-number-id
    access-token: test-access-token
    webhook-verify-token: test-webhook-token
    app-secret: test-app-secret
    api-endpoint: https://graph.whatsapp.com/v18.0
    sandbox-mode: true
