spring:
  application:
    name: aegisx-test
  datasource:
    # A distinct in-memory database per Spring application context.
    #
    # The suite deliberately builds several contexts (different @TestPropertySource sets), and they
    # used to share one named H2 database. A context starting with ddl-auto=create-drop then dropped
    # and recreated tables underneath contexts that were still cached, and cleanup in one class
    # (for example deleting every user) could violate foreign keys left by another. That made the
    # suite order-dependent: the same commit passed or failed depending on Surefire's run order.
    # H2 discards the database when the last connection closes, so this does not leak between runs.
    url: jdbc:h2:mem:aegisx_test_${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  profiles:
    active: test
  ai:
    openai:
      api-key: test-key-not-used-for-network-calls
  # Tests stay offline and use no external provider credentials.

jwt:
  secret: dev-jwt-secret-key-for-aegis-x-application-security-testing-purposes-only
  expiration: 86400000

server:
  port: 8080

razorpay:
  webhook-secret: offline-test-webhook-secret

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

aegisx:
  whatsapp:
    phone-number-id: test-phone-number-id
    access-token: test-access-token
    webhook-verify-token: test-webhook-token
    app-secret: test-app-secret
    api-endpoint: https://graph.whatsapp.com/v18.0
    sandbox-mode: true
