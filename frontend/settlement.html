<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settlement Desk — Aegis-X</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23C85A32'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" type="image/svg+xml" />

  <link rel="stylesheet" href="styles/tailwind.css" />
  <link rel="stylesheet" href="styles/animations.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/icons.css" />
</head>
<body class="bg-paper text-ink flex min-h-screen">

  <!-- Sidebar -->
  <div class="flex-1 flex flex-col min-w-0" data-app-main="">
    <header class="min-h-[4.5rem] py-2 bg-paper/90 backdrop-blur border-b border-ink/10 px-4 sm:px-6 flex items-center justify-between gap-3 sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <span class="editorial-badge badge-brass">
          <i class="fa-solid fa-landmark w-3.5 h-3.5 inline"></i>
          Settlement Processing
        </span>
      </div>
      <div class="flex items-center gap-3">
        <span id="results-count" class="text-xs font-mono-data text-ink-soft">— Records Found</span>
        <button id="process-reconciliation" class="aegis-btn-ink py-2 px-3 text-xs inline-flex items-center gap-2">
          <i class="fa-solid fa-arrows-rotate w-3.5 h-3.5"></i> Process Reconciliation
        </button>
      </div>
    </header>

    <main class="p-6 md:p-8 space-y-6 max-w-6xl w-full mx-auto">

      <p class="text-xs text-ink-soft" role="note">SIMULATED settlements do not move funds.</p>
      
      <!-- Search & Filters -->
      <div class="editorial-card p-6 bg-white grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
        <div class="md:col-span-6">
          <label class="block text-[10px] uppercase font-semibold tracking-wider text-ink-soft mb-1.5">Search Remittance Ref / Beneficiary</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass w-4 h-4 text-ink-soft absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="settlement-search" placeholder="Search settlement / transaction..." class="editorial-input pl-10" />
          </div>
        </div>
        <div class="md:col-span-3">
          <label class="block text-[10px] uppercase font-semibold tracking-wider text-ink-soft mb-1.5">Status Filter</label>
          <select id="filter-status" class="editorial-input">
            <option value="ALL">All Settlements</option>
            <option value="PENDING">Pending Setup</option>
            <option value="PROCESSING">Bank Processing</option>
            <option value="COMPLETED">Successfully Settled</option>
            <option value="FAILED">Failed / Rejected</option>
          </select>
        </div>
      </div>

      <!-- Table View -->
      <div class="editorial-card bg-white overflow-hidden overflow-x-auto">
        <table class="w-full text-left font-sans whitespace-nowrap">
          <thead>
            <tr class="bg-paper-dim/50 border-b border-ink/10 text-[10px] uppercase tracking-wider text-ink-soft font-semibold">
              <th class="py-4 px-6 font-semibold">Settlement ID</th>
              <th class="py-4 px-2 font-semibold">Processor</th>
              <th class="py-4 px-2 font-semibold">Amount (Gross)</th>
              <th class="py-4 px-2 font-semibold">Fees</th>
              <th class="py-4 px-2 font-semibold">Status</th>
              <th class="py-4 px-2 font-semibold">Retry / Reconciliation</th>
              <th class="py-4 px-6 font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="settlement-tbody" class="divide-y divide-ink/5">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <script type="module" src="pages/settlements.js"></script>
</body>
</html>
