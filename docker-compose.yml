services:
  # MySQL 8.4 LTS — the only supported database.
  #
  #   docker compose up -d mysql        # database only, on 127.0.0.1:3307
  #   docker compose up -d app          # database + backend
  #
  # The host port defaults to 3307 and can be overridden with MYSQL_HOST_PORT.
  # Port 3307 avoids colliding with a MySQL server already installed on the host at 3306.
  # Inside the compose network the backend reaches it as mysql:3306. Server settings are pinned to
  # the values the schema was verified against: utf8mb4 / utf8mb4_0900_ai_ci (the migrations set
  # case-sensitive collations per column where uniqueness needs them), UTC, and READ COMMITTED,
  # which is the isolation level this code was written and tested against. DATETIME(6) storage
  # assumes UTC here.
  mysql:
    image: mysql:8.4
    container_name: aegisx-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-aegisx}
      MYSQL_USER: ${DB_USERNAME:-aegisx}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aegisx}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aegisx-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # mysqladmin ping succeeds only once the server accepts connections; the first boot creates
      # the data directory, so the retry budget is generous.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisx-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-aegisx}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-aegisx}
      DB_PASSWORD: ${DB_PASSWORD:-aegisx}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_ENDPOINT: ${WHATSAPP_API_ENDPOINT:-https://graph.facebook.com/v26.0}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
      WHATSAPP_NOTIFICATION_TEMPLATE: ${WHATSAPP_NOTIFICATION_TEMPLATE:-notification}
      WHATSAPP_DOCUMENT_REQUEST_TEMPLATE: ${WHATSAPP_DOCUMENT_REQUEST_TEMPLATE:-document_request}
      APP_STORAGE_ROOT_PATH: ${APP_STORAGE_ROOT_PATH:-/data/storage}
      TESSERACT_PATH: ${TESSERACT_PATH:-}
    ports:
      - "8080:8080"
    volumes:
      - storage:/data/storage
    healthcheck:
      # The image's own HEALTHCHECK is not used by compose for dependency ordering, and `up --wait`
      # needs a compose-level probe.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  storage:
  mysqldata:
